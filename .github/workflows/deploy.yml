name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# The build is pushed to the gh-pages branch, which Pages serves, rather than
# uploaded as a Pages artifact. PR previews (preview.yml) live on that same
# branch under pr-preview/, and an artifact deploy replaces the whole site,
# which would delete every open preview on each production deploy.
permissions:
  contents: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` installs exactly what package-lock.json pins, so a build in
      # 2030 resolves the same tree as a build today. This is the answer to
      # "won't the npm dependencies rot?": the lockfile is committed and the
      # build runs here, not on a laptop.
      - run: npm ci

      - run: npm run build

      # Replaces everything on gh-pages except the previews. dist carries
      # CNAME and .nojekyll from public/; without .nojekyll, Pages would run
      # the output through Jekyll, which drops _astro/ and .well-known/.
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean-exclude: pr-preview/
          force: false
